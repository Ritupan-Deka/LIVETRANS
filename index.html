<!DOCTYPE html>
<html lang="en">

<head>
    <title>Speech Recognition Demo</title>
    <meta charset="utf-8" />
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="nanum-gothic-regular">
        A real-time transcribing platform that will convert the audio speech into text format
    </div>
    <div class="container">
        <main>
            <div id="visualizer" aria-label="Audio visualizer" role="presentation"></div>
            <section>
                <button type="button" id="startBtn">START</button>
                <button type="button" id="stopBtn" disabled>STOP</button>
                <button type="button" id="downloadBtn" class="button" disabled>DOWNLOAD</button>
            </section>
            <label for="transcript" class="sr-only">Transcript</label>
            <textarea id="transcript" aria-live="polite"
                placeholder="Your transcribed text will appear here..."></textarea>
        </main>
    </div>
    <script src="./script.js"></script>
</body>

</html>
